upstream backend {
  server backend:3001;
}

upstream frontend {
  server frontend:3000;
}

server {
    listen       80;

    # the load balancer doesn't compress, so it happens here. Video and images
    # are already compressed. gzip_proxied covers requests arriving through it.
    gzip on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        proxy_pass http://frontend;
    }

    location /ui {
        proxy_pass http://frontend;
    }

    location /uploads {
        proxy_pass http://backend/uploads;
    }

    location /uploadvideo {
        client_max_body_size       30m;
        proxy_pass http://backend/uploadvideo;
    }

    location /render/mosaic {
        proxy_pass http://backend/render/mosaic;
    }

    location = /api/failure {
        client_max_body_size       4k;
        proxy_pass http://backend/api/failure;
    }

    location /admin {
        proxy_pass http://backend/admin;
    }

    location /socket.io/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
}